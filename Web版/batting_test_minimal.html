<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0e13">

  <!-- CSP は rmst.html と完全に同じ(blob: なし) -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    media-src 'self' blob:;
    connect-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com;
    object-src 'none';
    base-uri 'self';
    worker-src 'self' blob:;
  ">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>骨格線テスト — Re'forma</title>
  <link rel="stylesheet" href="css/common.css">

  <style>
    body { background: #0b0e13; color: #fff; font-family: -apple-system, sans-serif; overflow-x: hidden; }
    #video-wrap {
      position: relative; width: 100%; aspect-ratio: 9/16; max-height: 65vh;
      background: #000; overflow: hidden;
    }
    #video, #overlay {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    }
    #video { z-index: 1; }
    #overlay { z-index: 2; pointer-events: none; }
    #status-bar {
      position: absolute; top: 8px; left: 8px; right: 8px; z-index: 3;
      display: flex; justify-content: space-between; pointer-events: none;
    }
    .pill {
      background: rgba(0,0,0,0.75); color: #fff; padding: 5px 10px;
      border-radius: 999px; font-size: 11px; font-family: monospace;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .pill.ok { color: #4ade80; }
    .pill.warn { color: #fbbf24; }
    .controls { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    #model-msg { text-align: center; font-size: 12px; color: #6b7280; padding: 6px; }
    #model-msg.ready { color: #4ade80; }
    #model-msg.error { color: #f87171; }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: #e11d48; color: #fff; }
    .btn-primary:disabled { opacity: 0.4; }
    .btn-secondary { background: #1f2937; color: #d1d5db; }
    #result-box {
      margin: 16px; padding: 16px; background: #111827;
      border-radius: 10px; font-size: 14px; line-height: 1.8; display: none;
    }
    #result-box b { color: #4ade80; }
    #result-box.error-box b { color: #f87171; }
  </style>
</head>
<body>

<div style="padding: 12px 16px; background: #111827; font-size: 13px; color: #9ca3af; border-bottom: 1px solid #1f2937;">
  骨格線テストページ — batting_test_minimal.html
</div>

<div id="video-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="status-bar">
    <div class="pill" id="model-pill">モデル準備中…</div>
    <div class="pill ok" id="fps-pill">-- fps</div>
  </div>
</div>

<div class="controls">
  <div id="model-msg">Pose モデルを読み込んでいます…</div>
  <button class="btn btn-primary" id="btn-prepare">カメラ + モデルを準備する →</button>
  <button class="btn btn-primary" id="btn-record" style="display:none" disabled>5秒録画を開始する</button>
  <button class="btn btn-secondary" id="btn-reload" style="display:none" onclick="location.reload()">もう一度</button>
</div>

<div id="result-box"></div>

<!-- スクリプト読み込み順: rmst.html と同じ順 + batting 用を追加 -->
<script src="js/user-profile.js"></script>
<script src="js/mediapipe-loader.js"></script>
<script src="js/quality-gate.js"></script>
<script src="js/batting-data.js"></script>
<script src="js/batting-analyzer.js"></script>
<script type="module">
import { DrawingUtils, PoseLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.10/vision_bundle.mjs';

(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const video   = $('video');
  const overlay = $('overlay');
  const ctx     = overlay.getContext('2d');

  let poseLandmarker = null;
  let drawing        = null;
  let stream         = null;
  let detecting      = false;
  let lastVideoTime  = -1;
  let recording      = false;
  let recordedFrames = [];
  let recordStart    = 0;
  let recordTimer    = null;
  let monitor        = null;

  // ─── 進捗コールバック(rmst.html と同タイミングで登録) ───
  window.ReformaMediaPipe.onProgress((event) => {
    $('model-msg').textContent  = event.message;
    $('model-pill').textContent = event.message;
    if (event.stage === 'ready') $('model-msg').classList.add('ready');
    else if (event.stage === 'error') $('model-msg').classList.add('error');
  });

  // ─── 準備ボタン ───
  $('btn-prepare').addEventListener('click', async () => {
    const btn = $('btn-prepare');
    btn.disabled = true;
    btn.textContent = '…準備中…';
    try {
      // rmst.html と同じ: preferLite: false で Full モデル強制
      poseLandmarker = await window.ReformaMediaPipe.getPoseLandmarker({ preferLite: false });
      drawing = new DrawingUtils(ctx);

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 }, height: { ideal: 720 },
          frameRate: { ideal: 30, max: 60 },
        },
        audio: false,
      });
      video.srcObject = stream;
      await new Promise((resolve, reject) => {
        video.onloadedmetadata = resolve;
        video.onerror = reject;
        setTimeout(() => reject(new Error('camera timeout')), 5000);
      });
      await video.play();
      overlay.width  = video.videoWidth;
      overlay.height = video.videoHeight;

      monitor = new window.ReformaQualityGate.QualityMonitor({
        windowSize: 30, minDetectionRate: 0.5, minFps: 20,
      });

      detecting = true;
      requestAnimationFrame(detect);

      btn.style.display = 'none';
      $('btn-record').style.display = '';
      $('btn-record').disabled = false;

    } catch (e) {
      showResult('error-box', '準備失敗: ' + e.message);
      btn.disabled = false;
      btn.textContent = 'カメラ + モデルを準備する →';
    }
  });

  // ─── 検出ループ(rmst.html と完全に同じロジック) ───
  async function detect() {
    if (!detecting) return;
    if (video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      const now = performance.now();
      try {
        const result    = poseLandmarker.detectForVideo(video, now);
        const landmarks = (result.landmarks && result.landmarks[0]) || null;

        ctx.clearRect(0, 0, overlay.width, overlay.height);
        if (landmarks) {
          drawing.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS, {
            color: '#87ceeb', lineWidth: 3,
          });
          drawing.drawLandmarks(landmarks.slice(11), {
            color: '#ffff00', radius: 4, lineWidth: 1,
          });
        }

        monitor.onFrame(landmarks, now);

        if (recording && landmarks) {
          recordedFrames.push({
            t: now - recordStart,
            landmarks: landmarks.map(l => ({
              x: +l.x.toFixed(4), y: +l.y.toFixed(4),
              z: +l.z.toFixed(4), v: +(l.visibility || 0).toFixed(3),
            })),
          });
        }

        const snap = monitor.getSnapshot();
        $('fps-pill').textContent = snap.fps.toFixed(0) + ' fps';
        $('fps-pill').className   = 'pill ' + (snap.fps >= 25 ? 'ok' : 'warn');

      } catch (e) {
        console.warn('detect error:', e);
      }
    }
    requestAnimationFrame(detect);
  }

  // ─── 5秒録画 ───
  $('btn-record').addEventListener('click', () => {
    const btn = $('btn-record');
    btn.disabled = true;
    btn.textContent = '録画中… (5秒)';
    recording      = true;
    recordedFrames = [];
    monitor.reset();
    recordStart    = performance.now();

    recordTimer = setTimeout(() => {
      recording  = false;
      detecting  = false;
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }

      const total   = recordedFrames.length;
      const elapsed = (performance.now() - recordStart) / 1000;
      const fps     = total > 1
        ? ((total - 1) * 1000 / (recordedFrames[total - 1].t - recordedFrames[0].t)).toFixed(1)
        : '0';

      if (total > 0) {
        showResult('', [
          '<b>骨格線: 検出できました</b>',
          '録画フレーム数: ' + total,
          '録画時間: '     + elapsed.toFixed(1) + ' 秒',
          '実効FPS: '      + fps,
        ].join('<br>'));
      } else {
        showResult('error-box', [
          '<b>骨格線: 検出できませんでした (0フレーム)</b>',
          '録画時間: ' + elapsed.toFixed(1) + ' 秒',
          '→ モデルは読めているが landmarks が常に null',
        ].join('<br>'));
      }

      btn.style.display     = 'none';
      $('btn-reload').style.display = '';
    }, 5000);
  });

  function showResult(cls, html) {
    const box = $('result-box');
    box.className  = 'result-box ' + cls;
    box.innerHTML  = html;
    box.style.display = '';
  }

  window.addEventListener('beforeunload', () => {
    detecting = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (window.ReformaMediaPipe) window.ReformaMediaPipe.release();
  });

})();
</script>

</body>
</html>
